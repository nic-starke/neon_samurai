<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>NEON_SAMURAI Config</title>
	<link rel="stylesheet" href="design-system/tokens.css" />
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div id="unsupported-banner" class="banner banner--error" hidden>
		Web MIDI is not available in this browser. Use <strong>Chrome</strong> or
		<strong>Edge</strong> - Firefox does not implement Web MIDI by default, and
		Safari's support is partial. See
		<a href="README.md">README.md</a> for details.
	</div>

	<header id="header">
		<div class="header__status">
			<span id="status-dot" class="status-dot status-dot--disconnected"></span>
			<span id="status-text">Not connected</span>
			<span id="fw-version" class="fw-version"></span>
		</div>
		<div class="header__actions">
			<button id="btn-connect" type="button">Connect</button>
			<button id="btn-load-device" type="button" disabled>Load from device</button>
			<button id="btn-save-device" type="button" disabled>Save to device</button>
			<span class="header__divider"></span>
			<button id="btn-save-preset" type="button">Save preset&hellip;</button>
			<label class="button-like" for="input-load-preset">Load preset&hellip;</label>
			<input id="input-load-preset" type="file" accept="application/json" hidden />
			<span class="header__divider"></span>
			<button id="btn-factory-reset" type="button" disabled class="button--danger">
				Factory reset device
			</button>
		</div>
	</header>

	<div id="toast-container" aria-live="polite"></div>

	<main>
		<section id="bank-selector" aria-label="Bank selector">
			<div class="bank-selector__tabs" role="tablist">
				<button type="button" class="bank-tab" data-bank="0">Bank 1</button>
				<button type="button" class="bank-tab" data-bank="1">Bank 2</button>
				<button type="button" class="bank-tab" data-bank="2">Bank 3</button>
			</div>
			<button id="btn-set-active-bank" type="button" disabled>
				Set as active bank on device
			</button>
			<span id="active-bank-indicator" class="active-bank-indicator"></span>
		</section>

		<section id="encoder-grid-section" aria-label="Encoder grid">
			<div id="encoder-grid" class="encoder-grid"></div>
		</section>

		<section id="side-switch-section" aria-label="Side switches">
			<h2>Side switches</h2>
			<div id="side-switch-row" class="side-switch-row"></div>
		</section>
	</main>

	<aside id="detail-panel" class="detail-panel" hidden>
		<div class="detail-panel__header">
			<h2 id="detail-panel-title">Encoder</h2>
			<button id="btn-close-detail" type="button" class="icon-button" aria-label="Close">
				&times;
			</button>
		</div>
		<div class="detail-panel__body" id="detail-panel-body">
			<!-- populated by ui.js -->
		</div>
	</aside>

	<script type="module" src="js/ui.js"></script>
</body>
</html>
