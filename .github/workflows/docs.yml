name: docs

on:
  push:
    # A tag push carries the same commit as the branch push that preceded it,
    # so without this every workflow here runs twice for one release - once
    # for the branch and again for the tag. Only release.yml wants tags.
    tags-ignore:
      - '**'
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  # The pages workflow only runs on main, so without this a manual that fails
  # to build would not be noticed until it had already been merged.
  manual:
    name: manual builds
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fails on missing front matter, a duplicate help topic id, or an empty
      # manual - all of which would otherwise publish silently broken.
      - name: Build
        run: python3 tools/docs/build_manual.py

      # Every link the manual makes to another manual page, and every help
      # topic anchor, has to point at something that exists.
      - name: Check internal links
        run: python3 tools/docs/check_links.py
