name: ci-image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit as well as latest, so a run that went wrong can
      # be repeated against the exact image it used.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ci:latest
            ghcr.io/${{ github.repository }}-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the toolchain that went in
        run: |
          docker run --rm ghcr.io/${{ github.repository }}-ci:latest \
            cat /etc/neon-samurai-toolchain | tee -a "$GITHUB_STEP_SUMMARY"
